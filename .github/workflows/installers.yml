# Windows（.exe インストーラー）と macOS（.dmg）を GitHub 上でビルドする。
#
# 使い方：GitHub の Actions タブ → build-installers → Run workflow
#        （または v0.1.0 のようなタグを push）
# 出来上がったインストーラーは、実行結果ページの「Artifacts」からダウンロードできる。
# タグを push した場合は、インストーラーを添付した Release も自動で作る。
#
# Google Drive 版を配布する場合は、リポジトリの Settings → Secrets and variables → Actions に
# OAUTH_CLIENT_JSON（Google Cloud の「デスクトップ アプリ」の JSON の中身）を登録すると、アプリに埋め込まれる。
name: build-installers

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            artifact: 2password-windows-installer
            path: target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            artifact: 2password-macos-dmg
            path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OAuth クライアントを埋め込む（Secret がある場合だけ）
        shell: bash
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$OAUTH_CLIENT_JSON" ]; then
            printf '%s' "$OAUTH_CLIENT_JSON" > "$RUNNER_TEMP/oauth-client.json"
            echo "TWOPW_EMBED_OAUTH_CLIENT=$RUNNER_TEMP/oauth-client.json" >> "$GITHUB_ENV"
            echo "OAuth クライアントを埋め込みます"
          else
            echo "OAUTH_CLIENT_JSON がないため、同期フォルダ版としてビルドします"
          fi

      - name: 暗号コアのテスト
        run: cargo test -p vault-core --release

      - name: インストーラーをビルド
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # タグを push したときだけ、インストーラーを添付した Release を作る。
  # ファイル名を固定しているので、README の releases/latest/download/... のリンクが常に最新版を指す。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/2password-windows-installer/*.exe 2password-windows-x64-setup.exe
          mv dist/2password-macos-dmg/*.dmg 2password-macos-universal.dmg
          sha256sum 2password-windows-x64-setup.exe 2password-macos-universal.dmg > SHA256SUMS.txt
          cat > notes.md <<NOTES
          ## ダウンロード

          | OS | ファイル |
          |---|---|
          | Windows 10 / 11（64bit） | \`2password-windows-x64-setup.exe\` |
          | macOS（Apple シリコン / Intel 共通） | \`2password-macos-universal.dmg\` |

          インストール手順は [docs/INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/INSTALL.md) を参照してください。

          - 有料の電子署名をしていないため、初回起動時に OS が警告を出します。
          - 2password は学習・検証用のプロジェクトで、第三者によるセキュリティ監査を受けていません。
          - \`SHA256SUMS.txt\` で、ダウンロードしたファイルのハッシュ値を確かめられます。
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "2password $GITHUB_REF_NAME" --notes-file notes.md --verify-tag 2password-windows-x64-setup.exe 2password-macos-universal.dmg SHA256SUMS.txt
