<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2password</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<!-- 文言は locales/<言語>.json にある。data-i18n のキーで差し替える -->

<!-- ===== 読み込み中 ===== -->
<section id="v-loading" class="view center"><div class="spinner"></div></section>

<!-- ===== 初回セットアップ ===== -->
<section id="v-welcome" class="view center" hidden>
  <div class="card narrow">
    <div class="brand"><span class="logo">2P</span><span>2password</span>
      <select class="lang-select" data-i18n-aria-label="settings.language"></select></div>
    <h1 data-i18n="welcome.title"></h1>
    <p class="muted" data-i18n="welcome.lead"></p>
    <div class="choices">
      <button class="choice" data-go="create">
        <b data-i18n="welcome.create"></b><span data-i18n="welcome.create_sub"></span>
      </button>
      <button class="choice" data-go="join">
        <b data-i18n="welcome.join"></b><span data-i18n="welcome.join_sub"></span>
      </button>
    </div>
  </div>
</section>

<!-- 保存先の選択（作成・参加で共通） -->
<template id="t-storage">
  <fieldset class="storage">
    <legend data-i18n="storage.legend"></legend>
    <label class="radio"><input type="radio" name="mode" value="drive" checked>
      <span><b>Google Drive</b> <span data-i18n="storage.recommended"></span><small data-i18n="storage.drive_note"></small></span></label>
    <label class="radio"><input type="radio" name="mode" value="folder">
      <span><b data-i18n="storage.folder"></b><small data-i18n="storage.folder_note"></small></span></label>
    <input class="folder-path" name="folder" data-i18n-placeholder="storage.folder_placeholder" hidden>
    <p class="warn oauth-missing" data-i18n="storage.oauth_missing" hidden></p>
  </fieldset>
</template>

<section id="v-create" class="view center" hidden>
  <form class="card narrow" id="f-create" autocomplete="off">
    <button type="button" class="back" data-go="welcome" data-i18n="common.back"></button>
    <h1 data-i18n="create.title"></h1>
    <div class="slot-storage"></div>
    <label><span data-i18n="common.account_password"></span>
      <input type="password" name="password" required autocomplete="new-password">
    </label>
    <div class="meter"><i id="c-meter"></i></div>
    <p class="hint" id="c-hint" data-i18n="create.hint"></p>
    <label><span data-i18n="create.password2"></span>
      <input type="password" name="password2" required autocomplete="new-password">
    </label>
    <p class="error" role="alert"></p>
    <button class="primary" type="submit" data-i18n="create.submit"></button>
    <p class="muted small" data-i18n="create.note"></p>
  </form>
</section>

<section id="v-created" class="view center" hidden>
  <div class="card narrow">
    <h1 data-i18n="created.title"></h1>
    <p data-i18n-html="created.lead_html"></p>
    <div class="secret-key" id="sk-out" dir="ltr"></div>
    <p class="muted small" id="kit-path"></p>
    <button class="secondary" id="b-open-kit" data-i18n="created.open_kit"></button>
    <label class="check"><input type="checkbox" id="kit-done"> <span data-i18n="created.kit_done"></span></label>
    <button class="primary" id="b-created-next" data-i18n="created.next" disabled></button>
  </div>
</section>

<section id="v-join" class="view center" hidden>
  <form class="card narrow" id="f-join" autocomplete="off">
    <button type="button" class="back" data-go="welcome" data-i18n="common.back"></button>
    <h1 data-i18n="join.title"></h1>
    <div class="slot-storage"></div>
    <label><span data-i18n="join.secret_key"></span>
      <input name="secret_key" required placeholder="2P1-XXXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXXX" spellcheck="false" autocapitalize="characters" dir="ltr">
    </label>
    <label><span data-i18n="common.account_password"></span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <p class="error" role="alert"></p>
    <button class="primary" type="submit" data-i18n="join.submit"></button>
  </form>
</section>

<!-- ===== ロック画面 ===== -->
<section id="v-lock" class="view center" hidden>
  <form class="card lock" id="f-unlock" autocomplete="off">
    <div class="lock-icon">🔒</div>
    <h1>2password</h1>
    <p class="muted small" id="lock-where"></p>
    <input type="password" name="password" data-i18n-placeholder="common.account_password" required autofocus autocomplete="current-password">
    <p class="error" role="alert"></p>
    <button class="primary" type="submit" data-i18n="lock.submit"></button>
    <button class="secondary os-unlock-btn" type="button" id="b-os-unlock" hidden></button>
    <select class="lang-select lock-lang" data-i18n-aria-label="settings.language"></select>
  </form>
</section>

<!-- ===== メイン ===== -->
<section id="v-main" class="view main" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo">2P</span><span>2password</span></div>
    <input type="search" id="q" data-i18n-placeholder="main.search">
    <div class="seg" role="group" data-i18n-aria-label="main.filter">
      <button type="button" class="on" data-filter="all" data-i18n="main.filter_all"></button>
      <button type="button" data-filter="passkey" data-i18n="main.filter_passkey"></button>
    </div>
    <button class="primary" id="b-add" data-i18n="main.add"></button>
    <button class="icon" id="b-sync" data-i18n-title="main.sync" data-i18n-aria-label="main.sync">⟳</button>
    <button class="icon" id="b-settings" data-i18n-title="settings.title" data-i18n-aria-label="settings.title">⚙</button>
    <button class="icon" id="b-lock" data-i18n-title="main.lock" data-i18n-aria-label="main.lock">🔒</button>
  </header>
  <div class="split">
    <nav class="list" id="list" data-i18n-aria-label="main.items"></nav>
    <article class="detail" id="detail">
      <div class="empty muted" data-i18n="main.empty"></div>
    </article>
  </div>
</section>

<!-- ===== 追加・編集 ===== -->
<dialog id="d-edit">
  <form method="dialog" id="f-edit" autocomplete="off">
    <h2 id="edit-title"></h2>
    <label><span data-i18n="edit.title"></span> <input name="title" required></label>
    <label><span data-i18n="field.username"></span> <input name="username" autocomplete="off"></label>
    <label><span data-i18n="field.password"></span>
      <span class="row">
        <input name="password" type="password" autocomplete="new-password">
        <button type="button" class="secondary" id="b-gen" data-i18n="btn.generate"></button>
        <button type="button" class="secondary" id="b-peek" data-i18n="btn.show"></button>
      </span>
    </label>
    <label><span data-i18n="edit.urls"></span> <textarea name="urls" rows="2" dir="ltr"></textarea></label>
    <label><span data-i18n="edit.totp"></span> <input name="totp" type="password" autocomplete="off" spellcheck="false" dir="ltr"></label>
    <p class="muted small" data-i18n-html="edit.totp_help_html"></p>
    <p class="muted small" data-i18n-html="edit.url_help_html"></p>
    <label><span data-i18n="field.notes"></span> <textarea name="notes" rows="3"></textarea></label>
    <p class="error" role="alert"></p>
    <div class="actions">
      <button type="button" class="secondary" id="b-edit-cancel" data-i18n="btn.cancel"></button>
      <button class="primary" type="submit" id="b-edit-save" data-i18n="btn.save"></button>
    </div>
  </form>
</dialog>

<!-- ===== 確認 ===== -->
<dialog id="d-confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="actions">
      <button value="no" class="secondary" data-i18n="btn.cancel"></button>
      <button value="yes" class="danger" id="confirm-yes"></button>
    </div>
  </form>
</dialog>

<!-- ===== ブラウザ拡張からの初回の確認 ===== -->
<dialog id="d-approve">
  <form method="dialog">
    <h2 id="ap-what"></h2>
    <p class="muted small" id="ap-lead"></p>
    <p class="approve-host" id="ap-host" dir="ltr"></p>
    <dl class="kv">
      <dt data-i18n="approve.item"></dt><dd id="ap-title"></dd>
      <dt data-i18n="field.username"></dt><dd id="ap-user"></dd>
    </dl>
    <p class="small" data-i18n="approve.question"></p>
    <div class="actions">
      <button value="no" class="secondary" data-i18n="approve.deny"></button>
      <button value="yes" class="primary" id="ap-allow"></button>
    </div>
  </form>
</dialog>

<!-- ===== 設定 ===== -->
<dialog id="d-settings" class="wide">
  <div class="settings">
    <div class="settings-head"><h2 data-i18n="settings.title"></h2><button class="icon" id="b-settings-close" data-i18n-title="settings.close" data-i18n-aria-label="settings.close">✕</button></div>

    <h3 data-i18n="settings.language"></h3>
    <select class="lang-select" data-i18n-aria-label="settings.language"></select>

    <h3 data-i18n="settings.storage"></h3>
    <dl class="kv" id="st-kv"></dl>
    <p class="muted small" data-i18n="settings.storage_note"></p>
    <pre class="hex" id="st-hex" dir="ltr"></pre>

    <h3 data-i18n="settings.google"></h3>
    <div class="row wrap">
      <button class="secondary" id="b-google-login" data-i18n="settings.google_login"></button>
      <button class="secondary" id="b-google-logout" data-i18n="settings.google_logout"></button>
      <button class="secondary" id="b-migrate" data-i18n="settings.migrate" hidden></button>
    </div>

    <h3 data-i18n="settings.passwd"></h3>
    <form id="f-passwd" class="row wrap" autocomplete="off">
      <input type="password" name="current" data-i18n-placeholder="settings.passwd_current" autocomplete="current-password" required>
      <input type="password" name="password" data-i18n-placeholder="settings.passwd_new" autocomplete="new-password" required>
      <input type="password" name="password2" data-i18n-placeholder="settings.passwd_again" autocomplete="new-password" required>
      <button class="secondary" type="submit" data-i18n="settings.passwd_submit"></button>
    </form>
    <p class="muted small" data-i18n="settings.passwd_note"></p>

    <h3 data-i18n="settings.unlock"></h3>
    <p class="muted small" id="os-note"></p>
    <label class="check"><input type="checkbox" id="os-on"> <span id="os-on-label"></span></label>
    <form id="f-os-enable" class="row wrap" autocomplete="off" hidden>
      <input type="password" name="password" data-i18n-placeholder="settings.os_password" autocomplete="current-password" required>
      <button class="primary" type="submit" data-i18n="settings.os_enable"></button>
      <button class="secondary" type="button" id="b-os-cancel" data-i18n="btn.cancel"></button>
    </form>
    <label class="check"><input type="checkbox" id="os-at-start"> <span id="os-at-start-label"></span></label>
    <p class="muted small" data-i18n="settings.os_security"></p>

    <h3 data-i18n="settings.startup"></h3>
    <label class="check"><input type="checkbox" id="startup-on"> <span data-i18n="settings.startup_on"></span></label>
    <p class="muted small" data-i18n="settings.startup_note"></p>
    <p class="small" id="startup-state"></p>

    <h3 data-i18n="settings.browser"></h3>
    <p class="muted small" data-i18n="settings.browser_note"></p>
    <p class="small" id="br-state"></p>
    <div class="row wrap">
      <button class="secondary" id="b-browser-install" data-i18n="settings.browser_connect"></button>
      <button class="secondary" id="b-browser-uninstall" data-i18n="settings.browser_disconnect"></button>
    </div>
    <details class="small">
      <summary data-i18n="settings.browser_extid"></summary>
      <input id="br-extid" data-i18n-placeholder="settings.browser_extid_placeholder" spellcheck="false" maxlength="32" dir="ltr">
      <p class="muted small" id="br-ids"></p>
    </details>
    <p class="muted small" data-i18n="settings.browser_guard"></p>
    <label class="check"><input type="checkbox" id="br-each"> <span data-i18n="settings.browser_each"></span></label>
    <p class="muted small" data-i18n="settings.browser_each_note"></p>
    <details class="small">
      <summary data-i18n="settings.browser_log"></summary>
      <ul class="log" id="br-log"></ul>
      <div class="row wrap">
        <button class="secondary" id="b-browser-forget" data-i18n="settings.browser_forget"></button>
        <span class="muted small" id="br-approved"></span>
      </div>
    </details>

    <h3 data-i18n="settings.import"></h3>
    <p class="muted small" data-i18n="settings.import_note"></p>
    <input type="file" id="f-import" accept=".csv,text/csv" hidden>
    <button class="secondary" id="b-import" data-i18n="settings.import_button"></button>

    <h3 data-i18n="settings.device"></h3>
    <p class="muted small" data-i18n="settings.device_note"></p>
    <button class="danger" id="b-forget" data-i18n="settings.device_forget"></button>
    <p class="muted small" data-i18n="settings.device_forget_note"></p>
    <p class="muted small" id="st-version"></p>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>
</body>
</html>
